[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
composeBom = "2024.12.01"
room = "2.6.1"
lifecycle = "2.8.7"

[libraries]
core-ktx = { module = "androidx.core:core-ktx", version = "1.15.0" }
appcompat = { module = "androidx.appcompat:appcompat", version = "1.7.0" }
activity-compose = { module = "androidx.activity:activity-compose", version = "1.9.3" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-icons = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.5" }
lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
lifecycle-viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.10.0" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.1.1" }
splash = { module = "androidx.core:core-splashscreen", version = "1.0.1" }
exif = { module = "androidx.exifinterface:exifinterface", version = "1.3.7" }
serialization = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.7.3" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "4.12.0" }
coil = { module = "io.coil-kt:coil-compose", version = "2.7.0" }
pdfbox = { module = "com.tom-roush:pdfbox-android", version = "2.0.27.0" }
