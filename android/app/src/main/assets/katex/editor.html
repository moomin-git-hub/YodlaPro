<!doctype html>
<html><head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="stylesheet" href="katex.min.css">
<script src="purify.min.js"></script><script src="katex.min.js"></script><script src="auto-render.min.js"></script>
<style>
:root{--fg:#121120;--bg:#fff;--bd:#e2e2ec;--mute:rgba(18,17,32,.45);--chip:rgba(18,17,32,.06);--brand:#6D4AFF}
.dark{--fg:#EFEFF6;--bg:#121120;--bd:#2E2D44;--mute:rgba(239,239,246,.45);--chip:rgba(255,255,255,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:transparent;font-family:sans-serif;color:var(--fg)}
.box{border:1.5px solid var(--bd);border-radius:16px;background:var(--bg);overflow:hidden}
.box.focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(109,74,255,.15)}
.box.err{border-color:#F43F5E}
#ed{min-height:96px;padding:12px 14px;outline:none;font-size:16px;line-height:1.45;word-wrap:break-word}
#ed.big{font-size:18px}
#ed:empty:before{content:attr(data-ph);color:var(--mute)}
#ed img{max-width:100%;max-height:220px;border-radius:10px}
#ed ul,#ed ol{padding-left:1.4em;margin:.2em 0}
#ed h3{font-size:1.25em;margin:.2em 0}
#ed code{font-family:monospace;background:var(--chip);padding:.1em .3em;border-radius:5px}
#ed pre{background:#1E1B2E;color:#E6E6F0;padding:10px;border-radius:10px;overflow-x:auto}
#ed a{color:var(--brand)}
#src{display:none;width:100%;min-height:110px;border:0;outline:none;padding:12px 14px;font:13px monospace;background:transparent;color:var(--fg);resize:vertical}
.bar{display:flex;gap:2px;overflow-x:auto;border-top:1px solid var(--bd);padding:4px 6px;scrollbar-width:none}
.bar::-webkit-scrollbar{display:none}
.bar button{flex:0 0 auto;min-width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--fg);font-size:15px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.bar button.on{background:rgba(109,74,255,.15);color:var(--brand)}
.bar button.txt{font-size:12px;background:var(--chip);margin-left:4px}
.sep{flex:0 0 1px;background:var(--bd);margin:8px 3px}
svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.pop{display:none;gap:6px;flex-wrap:wrap;padding:8px 10px;border-top:1px solid var(--bd)}
.pop.show{display:flex}
.pop button{border:0;border-radius:999px;width:28px;height:28px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.pop .item{width:auto;height:34px;padding:0 12px;border-radius:12px;background:var(--chip);color:var(--fg);font-weight:600;font-size:13px;box-shadow:none}
#prev{display:none;border-top:1px solid var(--bd);padding:8px 14px;font-size:15px}
#prev small{display:block;font-size:10px;font-weight:700;color:var(--mute);letter-spacing:.06em;text-transform:uppercase}
#busy{display:none;height:3px;background:linear-gradient(90deg,#6D4AFF,#D946EF)}
</style></head>
<body>
<div class="box" id="box">
  <div id="ed" contenteditable="true"></div>
  <textarea id="src" spellcheck="false"></textarea>
  <div id="prev"><small>Preview</small><div id="prevBody"></div></div>
  <div id="busy"></div>
  <div class="pop" id="pop"></div>
  <div class="bar" id="bar"></div>
</div>
<script>
const I = {
  ai:'<svg viewBox="0 0 24 24" style="stroke:#D946EF"><path d="M12 3l1.8 4.7L18.5 9.5 13.8 11.3 12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  img:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>',
  mark:'<svg viewBox="0 0 24 24"><path d="M9 11l-6 6v3h9l3-3"/><path d="M22 12l-4.6 4.6a2 2 0 0 1-2.8 0l-5.2-5.2a2 2 0 0 1 0-2.8L14 4"/></svg>',
  color:'<svg viewBox="0 0 24 24"><path d="M6 16l6-12 6 12M8 12h8"/><path d="M4 20h16" stroke-width="3"/></svg>',
  ul:'<svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>',
  ol:'<svg viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"/></svg>',
  link:'<svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>',
  code:'<svg viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>',
  clear:'<svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M9 20h6M12 4v16"/><path d="M3 3l18 18"/></svg>'
};
const ed = document.getElementById('ed'), src = document.getElementById('src'), box = document.getElementById('box'), pop = document.getElementById('pop'), bar = document.getElementById('bar');
let saved = null, srcMode = false, L = {}, popKind = '';
const A = window.Android || { onChange(){}, onHeight(){}, pickImage(){}, ai(){} };
const clean = (h) => DOMPurify.sanitize(h, { ALLOWED_TAGS: ['b','strong','i','em','u','s','strike','del','p','div','br','h1','h2','h3','h4','ul','ol','li','sub','sup','span','code','pre','a','img','mark','font','blockquote','hr'], ALLOWED_ATTR: ['href','src','alt','style','color','class'] });
function html(){ let h = srcMode ? src.value : ed.innerHTML; if (h === '<br>' || h === '<div><br></div>') h = ''; return h; }
function emit(){ A.onChange(html()); preview(); height(); }
function height(){ A.onHeight(Math.ceil(document.getElementById('box').getBoundingClientRect().height) + 4); }
function preview(){
  const h = html(), p = document.getElementById('prev');
  if (/\$[^$]+\$|\\\(|\\\[/.test(h)) { p.style.display='block'; const b=document.getElementById('prevBody'); b.innerHTML = clean(h); renderMathInElement(b,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false}); }
  else p.style.display='none';
}
function keep(){ const s = getSelection(); if (s.rangeCount && ed.contains(s.anchorNode)) saved = s.getRangeAt(0).cloneRange(); }
function restore(){ ed.focus(); const s = getSelection(); if (saved) { s.removeAllRanges(); s.addRange(saved); } }
function cmd(c, v){ restore(); document.execCommand('styleWithCSS', false, c==='hiliteColor'||c==='foreColor'); document.execCommand(c, false, v); keep(); emit(); state(); }
function ins(h){ restore(); document.execCommand('insertHTML', false, h); keep(); emit(); }
function state(){ for (const b of bar.querySelectorAll('[data-q]')) b.classList.toggle('on', document.queryCommandState(b.dataset.q)); }
function showPop(kind, items){ if (popKind === kind) { hidePop(); return; } popKind = kind; pop.innerHTML=''; items.forEach(n => pop.appendChild(n)); pop.classList.add('show'); height(); }
function hidePop(){ popKind=''; pop.classList.remove('show'); height(); }
function swatches(c, list){ return list.map(col => { const b=document.createElement('button'); b.style.background = col==='transparent' ? 'repeating-linear-gradient(45deg,#fff,#fff 4px,#ddd 4px,#ddd 8px)' : col; b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ cmd(c,col); hidePop(); }; return b; }); }
function items(list){ return list.map(([label, fn]) => { const b=document.createElement('button'); b.className='item'; b.textContent=label; b.onmousedown=e=>e.preventDefault(); b.onclick=()=>{ hidePop(); fn(); }; return b; }); }
const esc = (t) => t.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function btn(inner, title, fn, q){ const b=document.createElement('button'); b.innerHTML=inner; b.title=title; if(q) b.dataset.q=q; b.onmousedown=e=>e.preventDefault(); b.onclick=fn; bar.appendChild(b); return b; }
function build(){
  bar.innerHTML='';
  if (L.ai) btn(I.ai, 'AI', () => { keep(); showPop('ai', items([[L.ai_answer,()=>busy('answer')],[L.ai_question,()=>busy('question')],[L.ai_example,()=>busy('example')],[L.ai_explanation,()=>busy('explanation')],[L.ai_improve,()=>busy('improve')]])); });
  btn(I.img, L.image||'Image', () => { keep(); A.pickImage(); });
  btn(I.mark, 'Highlight', () => { keep(); showPop('mark', swatches('hiliteColor',['#fef08a','#bbf7d0','#bfdbfe','#fbcfe8','#fed7aa','transparent'])); });
  btn(I.color, 'Color', () => { keep(); showPop('color', swatches('foreColor',['#121120','#6D4AFF','#E11D48','#EA580C','#16A34A','#0284C7','#A855F7','#6B7280'])); });
  const s=document.createElement('span'); s.className='sep'; bar.appendChild(s);
  btn('<b>B</b>','Bold',()=>cmd('bold'),'bold'); btn('<i style="font-family:serif">I</i>','Italic',()=>cmd('italic'),'italic');
  btn('<u>U</u>','Underline',()=>cmd('underline'),'underline'); btn('<s>S</s>','Strike',()=>cmd('strikeThrough'),'strikeThrough');
  btn('H','Heading',()=>{ const v=(document.queryCommandValue('formatBlock')||'').toLowerCase(); cmd('formatBlock', v==='h3'?'div':'h3'); });
  btn(I.ul,'Bullets',()=>cmd('insertUnorderedList'),'insertUnorderedList'); btn(I.ol,'Numbered',()=>cmd('insertOrderedList'),'insertOrderedList');
  btn('X<sub style="font-size:9px">2</sub>','Subscript',()=>cmd('subscript'),'subscript'); btn('X<sup style="font-size:9px">2</sup>','Superscript',()=>cmd('superscript'),'superscript');
  btn('<i style="font-family:serif">fx</i>','Formula',()=>{ keep(); showPop('fx', items([['x²',()=>ins(' $x^2$ ')],['a/b',()=>ins(' $\\frac{a}{b}$ ')],['√x',()=>ins(' $\\sqrt{x}$ ')],['Σ',()=>ins(' $\\sum_{i=1}^{n} i$ ')],['∫',()=>ins(' $\\int_a^b f(x)dx$ ')],['H₂O',()=>ins(' $H_2O$ ')],['$ … $',()=>{ restore(); const t=getSelection().toString(); ins(' $'+esc(t||'x')+'$ '); }]])); });
  btn(I.code,'Code',()=>{ restore(); const t=getSelection().toString(); if(t.includes('\n')) ins('<pre><code>'+esc(t)+'</code></pre><div><br></div>'); else ins('<code>'+esc(t||'code')+'</code>&nbsp;'); });
  btn(I.link,'Link',()=>{ keep(); const t=getSelection().toString(); const u=/^https?:\/\//.test(t)?t:'https://'; showPop('link', [Object.assign(document.createElement('input'),{value:u,style:'flex:1;min-width:0;border:1px solid var(--bd);border-radius:10px;padding:8px;background:transparent;color:var(--fg)',id:'lnk'}), ...items([['OK',()=>{ const v=document.getElementById('lnk')?.value||''; if(/^https?:\/\/\S+\.\S+/.test(v)){ if(t) cmd('createLink',v); else ins('<a href="'+v.replace(/"/g,'')+'">'+esc(v)+'</a>&nbsp;'); } }]])]); });
  btn(I.clear,'Clear',()=>cmd('removeFormat'));
  const h=btn('HTML','HTML',()=>{ if(!srcMode){ src.value=ed.innerHTML; ed.style.display='none'; src.style.display='block'; h.classList.add('on'); h.textContent=L.done||'Done'; srcMode=true; } else { ed.innerHTML=clean(src.value); src.style.display='none'; ed.style.display='block'; h.classList.remove('on'); h.textContent='HTML'; srcMode=false; } emit(); }); h.classList.add('txt');
}
function busy(a){ document.getElementById('busy').style.display='block'; A.ai(a); }
window.doneBusy = () => { document.getElementById('busy').style.display='none'; };
window.setHtml = (h) => { const v = h && !/<\/?[a-z][\s\S]*>/i.test(h) ? esc(h).replace(/\n/g,'<br>') : clean(h||''); ed.innerHTML = v; if(srcMode) src.value=v; preview(); height(); };
window.insertImage = (url) => ins('<img src="'+url.replace(/"/g,'')+'" alt="">');
window.setup = (opts) => { L = opts.labels||{}; if(!opts.ai) delete L.ai; document.body.classList.toggle('dark', !!opts.dark); ed.dataset.ph = opts.placeholder||''; ed.classList.toggle('big', !!opts.big); box.classList.toggle('err', !!opts.error); build(); height(); };
window.setError = (e) => box.classList.toggle('err', !!e);
ed.addEventListener('input', emit);
ed.addEventListener('keyup', () => { keep(); state(); });
ed.addEventListener('mouseup', () => { keep(); state(); });
ed.addEventListener('focus', () => box.classList.add('focus'));
ed.addEventListener('blur', () => { keep(); box.classList.remove('focus'); });
src.addEventListener('input', emit);
ed.addEventListener('paste', (e) => { const h=e.clipboardData.getData('text/html'); if(h){ e.preventDefault(); ins(clean(h).replace(/ style="[^"]*"/g,'')); } });
new ResizeObserver(height).observe(box);
</script>
</body></html>
